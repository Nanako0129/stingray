name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    # Both runners, because the hook is bash + jq + curl + perl and the perl
    # redaction differs subtly between BSD and GNU userland.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to an immutable commit SHA. A tag is mutable: retargeting v6
      # would run attacker-controlled code in this workflow before any test
      # step. persist-credentials is off because nothing here pushes, and a
      # checkout that leaves a token in .git/config hands it to every later
      # step (zizmor: artipacked).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Tools present
        run: |
          for t in bash jq curl perl python3; do
            command -v "$t" >/dev/null || { echo "missing: $t"; exit 1; }
          done

      - name: Shell syntax
        run: |
          bash -n hooks/stingray.sh
          bash -n hooks/stingray-codex.sh
          bash -n tests/acceptance.sh
          bash -n tests/codex-hook.sh
          bash -n tests/network.sh
          bash -n tests/show-payload.sh

      - name: questions.json is valid and pins a model contract
        run: |
          jq -e 'to_entries | all(.value.type == "noul" and (.value.criteria | has("true") and has("false")))' \
            questions.json >/dev/null

      - name: Codex plugin definition is valid
        run: |
          jq -e . .codex-plugin/plugin.json >/dev/null
          jq -e . hooks/hooks.codex.json >/dev/null

      # No API key, no network. This is the whole gate: if the acceptance suite
      # needed a secret it could not run on a fork's pull request, which is
      # exactly where it is most worth running.
      - name: Acceptance (offline)
        run: bash tests/acceptance.sh

      # The stub server is local, so the fail-open paths are covered here too.
      - name: Fail-open paths (local stub)
        run: bash tests/network.sh

      # Case 7 and case 9 each exist to catch one implementation mistake. A test
      # that cannot fail is worse than no test, so CI re-derives that they still
      # fail against a mutant that makes the mistake.
      - name: Guards still guard (mutation check)
        run: bash tests/mutants.sh

      - name: Codex marketplace hook
        run: bash tests/codex-hook.sh
  # `claude plugin update` keys on the version string alone. A hook change under
  # an unchanged version reaches no existing install while the tool reports
  # success, so the version is enforced rather than remembered.
  version:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0   # the check needs the merge base, not just HEAD

      - name: Shipped changes carry a version bump
        env:
          BASE: ${{ github.base_ref }}
        run: bash tests/version-bump.sh "origin/$BASE"

      # The same reasoning as the mutation step above: a guard that cannot fail
      # is worse than no guard. Rebuild the exact condition it exists to catch —
      # a hook edit with the base version restored — and require a non-zero exit.
      - name: The version guard can fail (mutation check)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          base_v=$(git show "origin/$BASE:.claude-plugin/plugin.json" | jq -r .version)
          # Both manifests go back to the base version: leaving Codex ahead
          # would trip the equality check first, and the guard would fail for a
          # reason other than the one this step exists to prove. Set directly,
          # since the Codex manifest may not exist in the base revision.
          for m in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            jq --arg v "$base_v" '.version=$v' "$m" > p.json
            mv p.json "$m"
          done
          printf '\n# mutation probe\n' >> hooks/stingray.sh
          git -c user.email=ci@local -c user.name=ci commit -aqm probe
          if bash tests/version-bump.sh "origin/$BASE" 2> guard.err; then
            echo "version-bump.sh passed a hook change with no bump"
            exit 1
          fi
          cat guard.err
          grep -q '^version-bump: FAIL' guard.err || {
            echo "the guard failed, but not on the missing bump"; exit 1; }
          echo "guard failed as required"
